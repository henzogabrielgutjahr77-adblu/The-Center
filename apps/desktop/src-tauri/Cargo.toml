[package]
name = "the-center-desktop"
version = "0.1.0"
description = "The Center - Desktop Client"
authors = ["The Center Team"]
edition = "2021"

[lib]
name = "the_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
